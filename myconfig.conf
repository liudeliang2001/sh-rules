[Rule]
# Tailscale 与内网互联优先
DOMAIN-SUFFIX,ts.net,TAILSCALE
DOMAIN-WILDCARD,tail*.ts.net,TAILSCALE
IP-CIDR,100.64.0.0/10,TAILSCALE
IP-CIDR,192.168.88.0/24,TAILSCALE,no-resolve

# NAS 与个人 DDNS 静态/动态直连
DOMAIN-SUFFIX,ugnas.com,DIRECT
DOMAIN-SUFFIX,ug.link,DIRECT,extended-matching
DOMAIN-SUFFIX,liudl.top,DIRECT
DOMAIN-SUFFIX,liudl.asia,DIRECT
DOMAIN-SUFFIX,emcf.de5.net,DIRECT
DOMAIN-SUFFIX,liudl.de5.net,DIRECT
DOMAIN-SUFFIX,liudl.ccwu.cc,DIRECT
DOMAIN-SUFFIX,clcf.ccwu.cc,DIRECT
DOMAIN-SUFFIX,cfs.kdns.fr,DIRECT

# YouTube 去广告（UDP）
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

